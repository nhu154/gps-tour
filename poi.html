<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tour – Vĩnh Khánh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07101a;--s1:#0b1826;--s2:#0e1f2e;
  --border:rgba(96,168,224,.18);--border2:rgba(96,168,224,.08);
  --accent:#3a7fc1;--accent2:#60a8e0;
  --gold:#7ec8e3;--gold2:#a8d8f0;
  --muted:#4a7a9b;--muted2:#7aaecc;
  --text:#e8f4ff;--text2:#b8d8f0;
}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:0 16px 72px;
  background-image:
    radial-gradient(ellipse 80% 40% at 50% -10%,rgba(58,127,193,.15) 0%,transparent 70%);
}

/* HERO */
.hero{width:100%;max-width:460px;padding:52px 0 8px;text-align:center;animation:fadeDown .6s ease both}
.hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted2);margin-bottom:20px;text-transform:uppercase}
.hero h1{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.02em;background:linear-gradient(135deg,var(--text) 30%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}

/* CARD */
.card{width:100%;max-width:460px;background:linear-gradient(145deg,var(--s1),var(--s2));border:1px solid var(--border);border-radius:18px;padding:26px 22px;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 4px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(58,127,193,.1);animation:fadeUp .5s ease both}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(96,168,224,.35),transparent)}
.card-label{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:20px}

/* SPINNER */
.analyzing{text-align:center;padding:28px 0}
.ring{width:50px;height:50px;margin:0 auto 16px}
.ring svg{width:100%;height:100%;animation:spin 1.4s linear infinite}
.ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.ring .track{stroke:var(--border2)}
.ring .arc{stroke:var(--accent2);stroke-dasharray:80 200;animation:dash 1.4s ease-in-out infinite;stroke:var(--accent2)}
@keyframes dash{0%{stroke-dasharray:1 200;stroke-dashoffset:0}50%{stroke-dasharray:89 200}100%{stroke-dasharray:89 200;stroke-dashoffset:-124}}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing h3{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:6px}
.analyzing p{font-size:12px;color:var(--muted)}

/* BENCHMARK */
.bench-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bench-label{font-size:12px;color:var(--muted2)}
.bench-score{font-size:26px;font-weight:900;color:var(--text);letter-spacing:-.03em}
.bench-score small{font-size:12px;font-weight:400;color:var(--muted)}
.bench-track{height:8px;background:var(--border2);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);margin-bottom:22px}
.bench-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(96,168,224,.4);transition:width 1.2s cubic-bezier(.4,0,.2,1)}

/* RESULT VALUE */
.result-value{
  display:flex;flex-direction:column;align-items:center;
  padding:28px 0 20px;text-align:center;
  background:radial-gradient(circle at 50% 50%,rgba(58,127,193,.07) 0%,transparent 70%);
  border-radius:12px;margin-bottom:20px;
}
.result-value.strong{background:radial-gradient(circle at 50% 50%,rgba(58,127,193,.1) 0%,transparent 70%)}
.result-value.weak{background:radial-gradient(circle at 50% 50%,rgba(126,200,227,.07) 0%,transparent 70%)}
.result-number{font-size:80px;font-weight:900;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.result-value.strong .result-number{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-value.weak   .result-number{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-title{font-size:15px;font-weight:700;margin-top:10px}
.result-value.strong .result-title{color:var(--accent2)}
.result-value.weak   .result-title{color:var(--gold2)}
.result-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}

/* SPECS */
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
.spec-item{background:rgba(0,0,0,.25);border:1px solid var(--border2);border-radius:10px;padding:12px 14px}
.spec-item .sk{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-bottom:5px}
.spec-item .sv{font-size:13px;font-weight:700;color:var(--text)}

/* DIVIDER */
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0}

/* BUTTONS */
.btn-p{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700;letter-spacing:.03em;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 4px 20px rgba(58,127,193,.3)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(96,168,224,.4)}
.btn-p:active{transform:none}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

.btn-o{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:12px;background:rgba(58,127,193,.06);border:1px solid var(--border);color:var(--muted2);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px;transition:all .2s}
.btn-o:hover{border-color:var(--accent);color:var(--accent2)}

/* AUDIO */
.audio-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.ai{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:1px solid var(--border2);border-radius:11px;padding:12px 14px;transition:all .3s}
.ai.ready{border-color:rgba(58,127,193,.38);background:rgba(58,127,193,.06)}
.ai-name{font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-sub{font-size:10px;color:var(--muted);margin-top:2px}
.ai-bar{height:2px;background:var(--border2);border-radius:99px;margin-top:7px;overflow:hidden}
.ai-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s linear}
.ai-sz{font-size:11px;color:var(--accent2);font-weight:700;flex-shrink:0}

/* GUIDE */
.guide{background:rgba(0,0,0,.2);border:1px solid var(--border2);border-radius:11px;padding:14px 16px;font-size:12px;color:var(--muted2);line-height:1.8;margin-top:12px}
.guide b{color:var(--text2)}

/* STATUS TAG */
.stag{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:20px}
.stag.s{background:rgba(58,127,193,.15);border:1px solid rgba(96,168,224,.35);color:var(--accent2)}
.stag.w{background:rgba(126,200,227,.1);border:1px solid rgba(126,200,227,.3);color:var(--gold2)}
.stag .dot{width:6px;height:6px;border-radius:50%;animation:pulse 1.5s infinite}
.stag.s .dot{background:var(--accent2)}
.stag.w .dot{background:var(--gold2)}

.footer{margin-top:48px;font-size:11px;color:rgba(58,127,193,.25);text-align:center;letter-spacing:.06em}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">Vĩnh Khánh Audio Guide</div>
  <h1>Điểm tham quan<br>thông minh</h1>
  <p>Hệ thống tự phân tích cấu hình thiết bị<br>và đề xuất phương án cài đặt phù hợp.</p>
</div>

<!-- Card: Phân tích -->
<div class="card" id="card-detect">
  <div class="card-label">Phân tích thiết bị</div>

  <div class="analyzing" id="st-loading">
    <div class="ring">
      <svg viewBox="0 0 52 52">
        <circle class="track" cx="26" cy="26" r="22"/>
        <circle class="arc"   cx="26" cy="26" r="22"/>
      </svg>
    </div>
    <h3>Đang kiểm tra cấu hình...</h3>
    <p>Vui lòng chờ trong giây lát.</p>
  </div>

  <div id="st-done" style="display:none">
    <div class="bench-header">
      <span class="bench-label">Điểm hiệu năng</span>
      <div class="bench-score"><span id="sc">0</span><small> / 100</small></div>
    </div>
    <div class="bench-track"><div class="bench-fill" id="bf"></div></div>

    <div id="result-block"></div>
    <div class="spec-grid" id="spec-grid"></div>
  </div>
</div>

<!-- Card: Phương án -->
<div class="card" id="card-plan" style="display:none">
  <div class="card-label" id="plan-label">Phương án</div>
  <div id="plan-area"></div>
</div>

<div class="footer">© VinhKhanh Tour 2025</div>

<script>
// ── CONFIG ───────────────────────────────────────────
const APK_URL       = 'https://drive.google.com/uc?export=download&id=1OeHFtpZjamwrEByKXhm_-LX8a9nMM3Jg';
const DEEP_LINK     = 'vinhkhanhtour://poi/1?autoplay=true';
const HIGH_SCORE    = 55; // ngưỡng phân loại máy mạnh / yếu

const AUDIO_FILES = [
  {name:'Giới thiệu Vĩnh Khánh', file:'intro_vi.mp3',  size:'2.1 MB'},
  {name:'Quán Hải Sản Bình Dân',  file:'poi_1_vi.mp3', size:'1.4 MB'},
  {name:'Lẩu Cá Kèo Mười Chức',  file:'poi_2_vi.mp3', size:'1.6 MB'},
  {name:'Bánh Xèo Bà Tư',         file:'poi_3_vi.mp3', size:'0.9 MB'},
  {name:'Bún Mắm Cô Liên',        file:'poi_4_vi.mp3', size:'1.1 MB'},
  {name:'English Narration',      file:'intro_en.mp3', size:'2.3 MB'},
  {name:'Chinese Narration',      file:'intro_zh.mp3', size:'2.0 MB'},
];

// ── BENCHMARK CPU ────────────────────────────────────
function runBenchmark() {
  const t = performance.now();
  let s = 0;
  for (let i = 0; i < 2_000_000; i++) {
    s += Math.sqrt(i) * Math.sin(i * 0.001);
  }
  const ms = performance.now() - t;
  return Math.max(0, Math.min(100, Math.round(100 - ms / 2)));
}

// ── DETECT HARDWARE ──────────────────────────────────
function detectHardware() {
  const cores = navigator.hardwareConcurrency || 2;
  const ram   = navigator.deviceMemory        || 1;
  const net   = (navigator.connection?.effectiveType || '4g').toUpperCase();
  return { cores, ram, net };
}

// ── ANIMATE SCORE COUNTER ────────────────────────────
function animateScore(target) {
  const el = document.getElementById('sc');
  let cur = 0;
  const tick = () => {
    cur = Math.min(target, cur + Math.ceil((target - cur) / 6) + 1);
    el.textContent = cur;
    if (cur < target) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── RENDER SPEC GRID ─────────────────────────────────
function renderSpecs(hw) {
  const items = [
    ['CPU Cores', hw.cores + ' cores'],
    ['RAM', hw.ram >= 4 ? hw.ram + ' GB' : '< 4 GB'],
    ['Kết nối', hw.net],
    ['Hệ điều hành', /android/i.test(navigator.userAgent) ? 'Android' : /iphone|ipad/i.test(navigator.userAgent) ? 'iOS' : 'Other'],
  ];
  document.getElementById('spec-grid').innerHTML = items.map(([k, v]) =>
    `<div class="spec-item"><div class="sk">${k}</div><div class="sv">${v}</div></div>`
  ).join('');
}

// ── MAIN LOGIC (IF / ELSE) ───────────────────────────
function applyResult(score, hw) {
  const isStrong = score >= HIGH_SCORE; // if máy mạnh
  const value    = isStrong ? 1 : 0;   // 1 = mạnh, 0 = yếu

  // Fill benchmark bar
  setTimeout(() => { document.getElementById('bf').style.width = score + '%'; }, 80);
  animateScore(score);
  renderSpecs(hw);

  // Hiển thị kết quả số (1 hoặc 0)
  const rb = document.getElementById('result-block');

  if (isStrong) {
    // ── MÁY MẠNH: value = 1 ───────────────────────
    rb.innerHTML = `
      <div class="stag s"><span class="dot"></span>Máy mạnh — Kết quả: 1</div>
      <div class="result-value strong">
        <div class="result-number">1</div>
        <div class="result-title">Máy mạnh — Full bundle</div>
        <div class="result-sub">Tải được đầy đủ App + Audio + Chế độ Offline</div>
      </div>`;

    document.getElementById('plan-label').textContent = 'Máy mạnh (1) — Full App + Audio + Offline';
    const area = document.getElementById('plan-area');

    const files = [...AUDIO_FILES].sort(() => Math.random() - .5);
    window._files = files;

    // Danh sách audio
    const audioHtml = files.map((f, i) =>
      `<div class="ai" id="ai${i}">
        <div style="flex:1;min-width:0">
          <div class="ai-name">${f.name}</div>
          <div class="ai-sub">${f.file}</div>
          <div class="ai-bar"><div class="ai-fill" id="af${i}"></div></div>
        </div>
        <div class="ai-sz">${f.size}</div>
      </div>`
    ).join('');

    area.innerHTML = `
      <a href="${DEEP_LINK}" class="btn-p" style="margin-bottom:20px">Mở VinhKhanh Tour</a>
      <div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-bottom:10px">
        AUDIO KÈM THEO (${files.length} FILES)
      </div>
      <div class="audio-list">${audioHtml}</div>
      <div class="sep"></div>
      <button class="btn-p" id="btn-dl" onclick="startDownload()">Tải APK + Audio đầy đủ (Offline)</button>
      <a href="${APK_URL}" class="btn-o">Chỉ tải APK</a>
      <div class="guide">
        <b>Chưa cài app?</b><br>
        1. Nhấn "Tải APK" — lưu vào bộ nhớ<br>
        2. Mở file APK để cài đặt<br>
        3. Bật "Cài từ nguồn không xác định" nếu được hỏi<br>
        4. Quay lại quét QR để vào đúng điểm tham quan
      </div>`;

  } else {
    // ── MÁY YẾU: value = 0 ────────────────────────
    rb.innerHTML = `
      <div class="stag w"><span class="dot"></span>Máy yếu — Kết quả: 0</div>
      <div class="result-value weak">
        <div class="result-number">0</div>
        <div class="result-title">Máy yếu — Chỉ tải App</div>
        <div class="result-sub">Không hỗ trợ tải Audio và Offline mode</div>
      </div>`;

    document.getElementById('plan-label').textContent = 'Máy yếu (0) — Chỉ tải App';
    document.getElementById('plan-area').innerHTML = `
      <a href="${APK_URL}" class="btn-p">Tải APK (không có audio)</a>
      <a href="${DEEP_LINK}" class="btn-o">Mở app (nếu đã cài)</a>
      <div class="guide">
        <b>Máy yếu chỉ hỗ trợ:</b><br>
        - Tải và chạy App cơ bản<br>
        - Audio sẽ stream trực tiếp khi có mạng<br>
        - Không tải trước audio / không hỗ trợ Offline<br><br>
        <b>Cách cài:</b> Tải APK → cài đặt → quét lại QR tại quán.
      </div>`;
  }

  // Hiện card phương án
  document.getElementById('st-loading').style.display = 'none';
  document.getElementById('st-done').style.display    = 'block';
  document.getElementById('card-plan').style.display  = 'block';
}

// ── DOWNLOAD HIGH-END (animate bars) ─────────────────
let _dlRunning = false;
function startDownload() {
  if (_dlRunning) return;
  _dlRunning = true;
  const btn   = document.getElementById('btn-dl');
  const files = window._files || AUDIO_FILES;
  if (btn) btn.disabled = true;

  let i = 0;
  const next = () => {
    if (i >= files.length) {
      if (btn) btn.textContent = 'Hoàn tất! Đang tải APK...';
      // Trigger tai APK
      const a = document.createElement('a');
      a.href = APK_URL; a.download = '';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      return;
    }
    if (btn) btn.textContent = `Đang tải audio ${i + 1}/${files.length}...`;
    const fill = document.getElementById('af' + i);
    const item = document.getElementById('ai' + i);
    if (item) item.classList.add('ready');
    let p = 0;
    const iv = setInterval(() => {
      p = Math.min(100, p + Math.random() * 16 + 8);
      if (fill) fill.style.width = p + '%';
      if (p >= 100) { clearInterval(iv); i++; setTimeout(next, 250); }
    }, 100);
  };
  setTimeout(next, 400);
}

// ── ENTRY POINT ───────────────────────────────────────
window.addEventListener('load', () => {
  // Thử mở app qua deep link
  try { window.location.href = DEEP_LINK; } catch (_) {}

  // Chạy benchmark sau 300ms
  setTimeout(() => {
    const hw  = detectHardware();
    const run = () => {
      const raw   = runBenchmark();
      // Cộng điểm bonus nếu >= 4 cores
      const score = Math.min(100, raw + (hw.cores >= 4 ? 10 : 0));
      applyResult(score, hw);
    };

    if (typeof requestIdleCallback !== 'undefined') {
      requestIdleCallback(run, { timeout: 2000 });
    } else {
      setTimeout(run, 400);
    }
  }, 300);
});
</script>
</body>
</html>
