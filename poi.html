<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tour – Vĩnh Khánh</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:#0A0F0D;color:white;display:flex;flex-direction:column;
         align-items:center;justify-content:center;min-height:100vh;padding:28px;text-align:center}
    .icon{font-size:52px;margin-bottom:16px}
    h1{font-size:20px;font-weight:700;color:#4A8A56;margin-bottom:6px}
    .sub{font-size:13px;color:#475569;margin-bottom:32px}
    .spinner{width:36px;height:36px;border:3px solid #1A2E1E;
             border-top-color:#4A8A56;border-radius:50%;
             animation:spin .8s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:14px;color:#4A8A56;margin-bottom:0}
    .btn{display:block;width:100%;max-width:300px;padding:16px;
         border-radius:10px;font-size:15px;font-weight:600;
         text-decoration:none;margin:10px auto;border:none;cursor:pointer}
    .btn-dl{background:#1d4ed8;color:white}
    .btn-open{background:#4A8A56;color:white}
    .hint{font-size:12px;color:#475569;margin-top:20px;line-height:1.8}
    .hint b{color:#94a3b8}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="icon">📍</div>
  <h1>GPS Tour · Vĩnh Khánh</h1>
  <p class="sub">Quét để nghe thuyết minh &amp; chỉ đường</p>

  <div id="state-loading">
    <div class="spinner"></div>
    <p class="status">Đang mở ứng dụng...</p>
  </div>

  <div id="state-no-app" class="hidden">
    <p style="color:#94a3b8;font-size:14px;margin-bottom:24px">
      Bạn chưa cài <strong style="color:white">GPS Tour</strong>
    </p>
    <a id="btn-dl" class="btn btn-dl"
       href="https://drive.google.com/uc?export=download&id=1OeHFtpZjamwrEByKXhm_-LX8a9nMM3Jg">
      ⬇️ Tải GPS Tour APK
    </a>
    <a id="btn-open" class="btn btn-open" href="#">
      ✅ Đã cài rồi → Mở app
    </a>
    <p class="hint">
      Sau khi tải về, mở file APK để cài đặt.<br>
      Nếu bị chặn → <b>Cài đặt → Bảo mật</b><br>
      → bật <b>Cho phép cài từ nguồn khác</b>
    </p>
  </div>

  <script>
    const id     = new URLSearchParams(location.search).get('id') || '1';
    const scheme = `vinhkhanhtour://poi/${id}?autoplay=true`;

    document.getElementById('btn-open').href = scheme;

    // Thử mở app ngay
    window.location.href = scheme;

    // Sau 2.5s vẫn ở trang này → chưa cài app
    setTimeout(() => {
      document.getElementById('state-loading').classList.add('hidden');
      document.getElementById('state-no-app').classList.remove('hidden');
    }, 2500);
  </script>
</body>
</html>
